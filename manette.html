<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manette Blind Test</title>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
  <style>
    body { background: #161b22; color: white; text-align: center; font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
    .avatar-selector { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
    .avatar-opt { font-size: 2.2em; cursor: pointer; padding: 8px; border: 2px solid transparent; border-radius: 50%; background: #0d1117; }
    .avatar-opt.selected { border-color: #238636; transform: scale(1.1); }
    
    input { padding: 15px; border-radius: 10px; border: none; width: 90%; font-size: 1.2em; margin-bottom: 20px; box-sizing: border-box; background: #0d1117; color: white; border: 1px solid #30363d; }
    button { background: #238636; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1.1em; width: 90%; cursor: pointer; }
    
    .qcm-btn { background: #1f6feb !important; margin: 8px !important; width: 80% !important; font-size: 1.1em !important; display: block; margin-left: auto !important; margin-right: auto !important; }
    
    .hidden { display: none !important; }
    #feedback { margin-top: 20px; font-weight: bold; font-size: 1.2em; color: #39d353; }
  </style>
</head>
<body>

<div class="controller">
  <!-- ÉCRAN DE CONNEXION -->
  <div id="login">
    <h2>Choisis ton style :</h2>
    <div class="avatar-selector">
      <span class="avatar-opt selected" onclick="selectAvatar(this)">🐱</span>
      <span class="avatar-opt" onclick="selectAvatar(this)">🐶</span>
      <span class="avatar-opt" onclick="selectAvatar(this)">🦊</span>
      <span class="avatar-opt" onclick="selectAvatar(this)">🦁</span>
      <span class="avatar-opt" onclick="selectAvatar(this)">🐸</span>
    </div>
    <input type="text" id="username" placeholder="Ton pseudo...">
    <button onclick="joinGame()">Rejoindre la partie 🎮</button>
  </div>

  <!-- ÉCRAN DE JEU -->
  <div id="game-controls" class="hidden">
    <h3 id="welcome">Prêt ?</h3>
    
    <!-- Zone Réponse Libre -->
    <div id="free-answer-zone">
        <input type="text" id="answer-input" placeholder="Tape ta réponse...">
        <button onclick="sendAnswer()" id="send-btn">VALIDER 🚀</button>
        <p style="margin: 25px 0; color: #8b949e; font-weight: bold;">— OU —</p>
        <button onclick="showQCM()" style="background: #8957e5;">Je ne sais pas... 🤔</button>
    </div>

    <!-- Zone QCM (Cachée par défaut) -->
    <div id="qcm-zone" class="hidden">
        <p style="font-size: 1.2em; font-weight: bold;">Choisis une option :</p>
        <div id="qcm-buttons"></div>
        <button onclick="hideQCM()" style="background: #484f58; margin-top: 25px; font-size: 0.9em; width: 50%;">Retour</button>
    </div>

    <div id="feedback"></div>
  </div>
</div>

<script>
  // CONFIGURATION FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyC18xshyF3ShbjesR5NsjdmBfAiBaP36BE",
    authDomain: "blindtestfamille.firebaseapp.com",
    databaseURL: "https://blindtestfamille-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "blindtestfamille",
    storageBucket: "blindtestfamille.firebasestorage.app",
    messagingSenderId: "319100843512",
    appId: "1:319100843512:web:5fb89272cd2131f350920d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  let myId = null;
  let myName = "";
  let selectedAvatar = "🐱";

  // SÉLECTION DE L'AVATAR
  function selectAvatar(el) {
    document.querySelectorAll('.avatar-opt').forEach(opt => opt.classList.remove('selected'));
    el.classList.add('selected');
    selectedAvatar = el.innerText;
  }

  // REJOINDRE LE JEU
  function joinGame() {
    myName = document.getElementById('username').value;
    if(!myName) return alert("Choisis un pseudo !");
    
    const newPlayer = db.ref('players').push();
    myId = newPlayer.key;
    newPlayer.set({ name: myName, score: 0, avatar: selectedAvatar });

    document.getElementById('login').classList.add('hidden');
    document.getElementById('game-controls').classList.remove('hidden');
    document.getElementById('welcome').innerText = selectedAvatar + " " + myName;
  }

  // GESTION DE L'AFFICHAGE DU QCM
  function showQCM() {
    db.ref('gameState').once('value', (snap) => {
      const state = snap.val();
      const container = document.getElementById('qcm-buttons');
      container.innerHTML = "";
      
      if(!state || !state.choix) {
        alert("Attends que la musique commence !");
        return;
      }
      
      state.choix.forEach(option => {
        const btn = document.createElement('button');
        btn.innerText = option;
        btn.className = "qcm-btn";
        btn.onclick = () => {
          document.getElementById('answer-input').value = option;
          sendAnswer(true); // Indique que ça vient du QCM
        };
        container.appendChild(btn);
      });

      document.getElementById('free-answer-zone').classList.add('hidden');
      document.getElementById('qcm-zone').classList.remove('hidden');
    });
  }

  function hideQCM() {
    document.getElementById('qcm-zone').classList.add('hidden');
    document.getElementById('free-answer-zone').classList.remove('hidden');
  }

  // ENVOI DE LA RÉPONSE ET AUTO-CORRECTION
  function sendAnswer(isQcm = false) {
    const ans = document.getElementById('answer-input').value;
    if(!ans) return;
    
    // Vérification de l'état du jeu (Timer & Solution)
    db.ref('gameState').once('value', (snap) => {
      const state = snap.val();
      
      if(state && state.accepting === true) {
        const finalAns = isQcm ? ans + " (QCM)" : ans;
        
        // AUTO-CORRECTION POUR LE QCM (+1 Point)
        if(isQcm) {
          if(ans === state.solution) {
            db.ref('players/' + myId + '/score').transaction(s => (s || 0) + 1);
            document.getElementById('feedback').style.color = "#39d353";
            document.getElementById('feedback').innerText = "🎯 Bonne réponse ! (+1 pt)";
          } else {
            document.getElementById('feedback').style.color = "#ff7b72";
            document.getElementById('feedback').innerText = "❌ Faux ! C'était " + state.solution;
          }
        } else {
            // Message classique pour la réponse libre
            document.getElementById('feedback').style.color = "#39d353";
            document.getElementById('feedback').innerText = "✅ Réponse envoyée !";
        }

        // On envoie la réponse au PC pour affichage
        db.ref('answers/' + myId).set({ 
          text: finalAns, 
          name: myName, 
          avatar: selectedAvatar 
        });
        
        document.getElementById('answer-input').value = "";
        hideQCM();
        
        // Efface le message après 4 secondes
        setTimeout(() => { document.getElementById('feedback').innerText = ""; }, 4000);
      } else {
        document.getElementById('feedback').style.color = "#ff7b72";
        document.getElementById('feedback').innerText = "⏳ Trop tard ! Temps écoulé.";
      }
    });
  }
</script>
</body>
</html>
