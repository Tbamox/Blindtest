<div class="controller">
  <div id="login">
    <h2>Entre ton pseudo :</h2>
    <input type="text" id="username" placeholder="Ton nom...">
    <button onclick="joinGame()">Rejoindre</button>
  </div>

  <div id="game-controls" class="hidden">
    <h3 id="welcome">Prêt ?</h3>
    <input type="text" id="answer-input" placeholder="Tape ta réponse ici !">
    <button onclick="sendAnswer()" id="send-btn">ENVOYER 🚀</button>
    <div id="feedback"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC18xshyF3ShbjesR5NsjdmBfAiBaP36BE",
    authDomain: "blindtestfamille.firebaseapp.com",
    databaseURL: "https://blindtestfamille-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "blindtestfamille",
    storageBucket: "blindtestfamille.firebasestorage.app",
    messagingSenderId: "319100843512",
    appId: "1:319100843512:web:5fb89272cd2131f350920d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let myId = null;
  let myName = "";

  function joinGame() {
    myName = document.getElementById('username').value;
    if(!myName) return alert("Choisis un nom !");
    
    const newPlayer = db.ref('players').push();
    myId = newPlayer.key;
    newPlayer.set({ name: myName, score: 0 });

    document.getElementById('login').classList.add('hidden');
    document.getElementById('game-controls').classList.remove('hidden');
    document.getElementById('welcome').innerText = "Bonne chance " + myName + " !";
  }

  function sendAnswer() {
    const ans = document.getElementById('answer-input').value;
    if(!ans) return; // Ne rien envoyer si c'est vide
    
    // On envoie la réponse ET le nom du joueur
    db.ref('answers/' + myId).set({ 
      text: ans, 
      name: myName, 
      time: Date.now() 
    });
    
    document.getElementById('answer-input').value = "";
    document.getElementById('feedback').innerText = "✅ Réponse envoyée !";
    
    // Effacer le message après 3 secondes
    setTimeout(() => {
        document.getElementById('feedback').innerText = "";
    }, 3000);
  }
</script>

<style>
  body { background: #161b22; color: white; text-align: center; font-family: 'Segoe UI', sans-serif; padding-top: 50px; }
  input { padding: 15px; border-radius: 10px; border: none; width: 80%; font-size: 1.2em; margin-bottom: 20px; box-sizing: border-box;}
  button { background: #238636; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; font-size: 1.2em; cursor: pointer; width: 80%;}
  .hidden { display: none; }
  #feedback { margin-top: 20px; font-size: 1.2em; color: #39d353; font-weight: bold; }
</style>
