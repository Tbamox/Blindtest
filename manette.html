<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blind Test — Manette</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg:       #07090f;
      --surface:  #0e1420;
      --card:     #141d2e;
      --border:   #1e2d4a;
      --accent:   #00d4ff;
      --green:    #22c55e;
      --red:      #ef4444;
      --yellow:   #fbbf24;
      --purple:   #a855f7;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --radius:   18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
    }

    /* Dot grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(0,212,255,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      z-index: 1;
      overflow-y: auto;
    }
    .screen.hidden { display: none !important; }

    /* ── Typography ── */
    .big-title {
      font-family: 'Bangers', cursive;
      font-size: 2.8rem;
      letter-spacing: 3px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 6px;
    }
    .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    /* ── Avatar selector ── */
    .avatar-grid {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .av-opt {
      font-size: 2rem;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .2s, border-color .2s, background .2s;
      user-select: none;
    }
    .av-opt.selected {
      border-color: var(--accent);
      background: rgba(0,212,255,0.12);
      transform: scale(1.15);
    }

    /* ── Input ── */
    .field {
      width: 100%;
      max-width: 360px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px 18px;
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      border: 2px solid var(--border);
      outline: none;
      margin-bottom: 14px;
      transition: border-color .2s;
      -webkit-appearance: none;
    }
    .field:focus { border-color: var(--accent); }
    .field::placeholder { color: var(--muted); font-weight: 600; }

    /* ── Buttons ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 360px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 900;
      padding: 18px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: transform .15s, filter .15s, opacity .15s;
      letter-spacing: 0.5px;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:disabled:active { transform: none; }

    .btn-join    { background: linear-gradient(135deg, var(--accent), #0099cc); color: #000; margin-bottom: 0; }
    .btn-send    { background: linear-gradient(135deg, var(--green), #16a34a); color: #fff; margin-bottom: 14px; }
    .btn-qcm     { background: linear-gradient(135deg, var(--purple), #7c3aed); color: #fff; margin-bottom: 14px; }
    .btn-back    { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 12px; font-size: 0.9rem; max-width: 160px; }
    .btn-choice  {
      background: var(--card);
      border: 2px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      padding: 20px 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      transition: border-color .2s, background .2s, transform .15s;
    }
    .btn-choice:active { transform: scale(0.97); }
    .btn-choice.correct { border-color: var(--green); background: rgba(34,197,94,0.12); color: var(--green); }
    .btn-choice.wrong   { border-color: var(--red);   background: rgba(239,68,68,0.10);  color: var(--red); }

    /* ── Score badge ── */
    .score-badge {
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.25);
      border-radius: 50px;
      padding: 6px 18px;
      font-family: 'Bangers', cursive;
      font-size: 1.4rem;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    /* ── Player name header ── */
    .player-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 28px;
    }
    .player-avatar { font-size: 3rem; }
    .player-name   { font-size: 1.3rem; font-weight: 900; }

    /* ── Status card ── */
    .status-card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .status-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .status-label {
      font-size: 1rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* ── Feedback ── */
    #feedback {
      width: 100%;
      max-width: 360px;
      min-height: 48px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 12px;
      padding: 12px;
      margin-top: 14px;
      transition: all .3s;
    }
    #feedback.fb-ok   { background: rgba(34,197,94,0.12);  color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    #feedback.fb-err  { background: rgba(239,68,68,0.10);  color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
    #feedback.fb-sent { background: rgba(0,212,255,0.08);  color: var(--accent);border: 1px solid rgba(0,212,255,0.25); }
    #feedback.hidden  { display: none; }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
      margin: 4px 0 14px;
      width: 100%;
      max-width: 360px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Waiting dots ── */
    .dots span {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      margin: 0 3px;
      animation: bounce 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-8px); opacity: 1; }
    }

    /* ── Game over ── */
    #screen-gameover .big-title { font-size: 3rem; }
    .final-score {
      font-family: 'Bangers', cursive;
      font-size: 4rem;
      color: var(--yellow);
      letter-spacing: 3px;
      line-height: 1;
      margin: 12px 0 6px;
    }

    @keyframes popIn {
      from { transform: scale(0.75); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .pop { animation: popIn .35s cubic-bezier(.17,.67,.38,1.3); }
  </style>
</head>
<body>

  <!-- ══ LOGIN ══ -->
  <div class="screen" id="screen-login">
    <div class="big-title">🎵 BLIND TEST</div>
    <div class="sub">Choisis ton avatar et ton pseudo</div>

    <div class="avatar-grid" id="avatar-grid">
      <div class="av-opt selected" onclick="selectAvatar(this)">🐱</div>
      <div class="av-opt" onclick="selectAvatar(this)">🐶</div>
      <div class="av-opt" onclick="selectAvatar(this)">🦊</div>
      <div class="av-opt" onclick="selectAvatar(this)">🦁</div>
      <div class="av-opt" onclick="selectAvatar(this)">🐸</div>
      <div class="av-opt" onclick="selectAvatar(this)">🐼</div>
      <div class="av-opt" onclick="selectAvatar(this)">🦄</div>
      <div class="av-opt" onclick="selectAvatar(this)">🐙</div>
    </div>

    <input class="field" type="text" id="username" placeholder="Ton pseudo…" maxlength="18" autocomplete="off">
    <button class="btn btn-join" onclick="joinGame()">Rejoindre 🎮</button>
    <div id="login-error" style="color:var(--red); font-weight:700; margin-top:12px; min-height:20px;"></div>
  </div>

  <!-- ══ WAITING (avant que la partie commence) ══ -->
  <div class="screen hidden" id="screen-waiting">
    <div class="player-header">
      <div class="player-avatar" id="wait-avatar">🐱</div>
      <div class="player-name" id="wait-name">Joueur</div>
    </div>
    <div class="status-card">
      <div class="status-icon">⏳</div>
      <div class="status-label">En attente de la partie…</div>
      <div class="dots" style="margin-top:14px;">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="sub">L'hôte va lancer la musique !</div>
  </div>

  <!-- ══ JEU ══ -->
  <div class="screen hidden" id="screen-game">
    <div class="player-header">
      <div class="player-avatar" id="game-avatar">🐱</div>
      <div class="player-name"  id="game-name">Joueur</div>
      <div class="score-badge"  id="game-score">0 pt</div>
    </div>

    <!-- Réponse libre -->
    <div id="free-zone" style="width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center;">
      <input class="field" type="text" id="answer-input" placeholder="Ta réponse…" autocomplete="off" maxlength="60">
      <button class="btn btn-send" id="send-btn" onclick="sendAnswer(false)">🚀 VALIDER</button>
      <div class="divider">ou</div>
      <button class="btn btn-qcm" onclick="showQCM()">🤔 Je ne sais pas…</button>
    </div>

    <!-- QCM -->
    <div id="qcm-zone" style="width:100%; max-width:360px; display:none; flex-direction:column; align-items:center;">
      <p style="font-weight:800; font-size:1.05rem; margin-bottom:16px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;">Choisis une réponse</p>
      <div id="qcm-buttons" style="width:100%;"></div>
      <button class="btn btn-back" onclick="hideQCM()" style="margin-top:8px;">← Retour</button>
    </div>

    <div id="feedback" class="hidden"></div>
  </div>

  <!-- ══ TEMPS ÉCOULÉ (entre les manches) ══ -->
  <div class="screen hidden" id="screen-timeup">
    <div class="status-card pop">
      <div class="status-icon">⏰</div>
      <div class="status-label">Temps écoulé !</div>
      <p style="color:var(--muted); margin-top:10px; font-size:0.95rem;">L'hôte va révéler la réponse…</p>
    </div>
    <div class="score-badge" id="timeup-score">0 pt</div>
  </div>

  <!-- ══ FIN DE JEU ══ -->
  <div class="screen hidden" id="screen-gameover">
    <div class="big-title">🏆 TERMINÉ !</div>
    <div class="status-card pop" style="margin-top:20px;">
      <div class="player-avatar" id="end-avatar" style="font-size:3rem; margin-bottom:10px;">🐱</div>
      <div class="player-name"   id="end-name" style="margin-bottom:6px;">Joueur</div>
      <div class="sub">Ton score final :</div>
      <div class="final-score" id="end-score">0 pt</div>
    </div>
    <button class="btn btn-join" onclick="location.reload()" style="margin-top:20px; max-width:280px;">🔄 Rejouer</button>
  </div>

<script>
  /* ── FIREBASE ── */
  const firebaseConfig = {
    apiKey: "AIzaSyC18xshyF3ShbjesR5NsjdmBfAiBaP36BE",
    authDomain: "blindtestfamille.firebaseapp.com",
    databaseURL: "https://blindtestfamille-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "blindtestfamille",
    storageBucket: "blindtestfamille.firebasestorage.app",
    messagingSenderId: "319100843512",
    appId: "1:319100843512:web:5fb89272cd2131f350920d"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  /* ── STATE ── */
  let myId = null;
  let myName = "";
  let myAvatar = "🐱";
  let myScore = 0;
  let hasAnswered = false;
  let currentScreen = 'login';

  /* ── HELPERS ── */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    currentScreen = id;
  }

  function setFeedback(msg, type) {
    const el = document.getElementById('feedback');
    el.textContent = msg;
    el.className = 'fb-' + type;
    if (msg) {
      setTimeout(() => {
        el.className = 'hidden';
        el.textContent = '';
      }, 3500);
    }
  }

  /* ── AVATAR ── */
  function selectAvatar(el) {
    document.querySelectorAll('.av-opt').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    myAvatar = el.textContent.trim();
  }

  /* ── REJOINDRE ── */
  function joinGame() {
    myName = document.getElementById('username').value.trim();
    const errEl = document.getElementById('login-error');
    if (!myName) { errEl.textContent = "Choisis un pseudo !"; return; }
    errEl.textContent = "";

    const ref = db.ref('players').push();
    myId = ref.key;

    // Nettoyage automatique si l'onglet/téléphone se ferme
    ref.onDisconnect().remove();

    ref.set({ name: myName, score: 0, avatar: myAvatar });

    // Mise à jour des écrans avec le nom/avatar
    ['wait', 'game', 'end'].forEach(prefix => {
      const av = document.getElementById(prefix + '-avatar');
      const nm = document.getElementById(prefix + '-name');
      if (av) av.textContent = myAvatar;
      if (nm) nm.textContent = myName;
    });

    showScreen('screen-waiting');
    listenToGameState();
    listenToMyScore();
  }

  /* ── ÉCOUTE DU SCORE ── */
  function listenToMyScore() {
    db.ref('players/' + myId + '/score').on('value', (snap) => {
      myScore = snap.val() || 0;
      const label = myScore <= 1 ? 'pt' : 'pts';
      document.getElementById('game-score').textContent = myScore + ' ' + label;
      document.getElementById('timeup-score').textContent = myScore + ' ' + label;
      document.getElementById('end-score').textContent = myScore + ' ' + label;
    });
  }

  /* ── ÉCOUTE DE L'ÉTAT DU JEU ── */
  function listenToGameState() {
    db.ref('gameState').on('value', (snap) => {
      const state = snap.val();
      if (!state) return;

      if (state.gameOver) {
        showScreen('screen-gameover');
        return;
      }

      if (state.accepting === true) {
        hasAnswered = false;
        resetAnswerUI();
        showScreen('screen-game');
        return;
      }

      // Temps écoulé (accepting = false, pas gameOver)
      if (state.accepting === false && currentScreen === 'screen-game') {
        showScreen('screen-timeup');
      }
    });
  }

  /* ── RESET UI entre les questions ── */
  function resetAnswerUI() {
    hideQCM();
    document.getElementById('answer-input').value = '';
    document.getElementById('send-btn').disabled = false;
    document.getElementById('feedback').className = 'hidden';
    document.getElementById('feedback').textContent = '';
    // Réinitialise les couleurs des boutons QCM
    document.querySelectorAll('.btn-choice').forEach(b => {
      b.classList.remove('correct', 'wrong');
      b.disabled = false;
    });
  }

  /* ── QCM ── */
  function showQCM() {
    db.ref('gameState').once('value', (snap) => {
      const state = snap.val();
      if (!state || !state.choix || !state.accepting) {
        setFeedback("Attends que la musique commence !", 'err');
        return;
      }

      const container = document.getElementById('qcm-buttons');
      container.innerHTML = '';
      state.choix.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-choice';
        btn.style.width = '100%';
        btn.textContent = option;
        btn.onclick = () => sendAnswer(true, option, btn, state.solution);
        container.appendChild(btn);
      });

      document.getElementById('free-zone').style.display = 'none';
      document.getElementById('qcm-zone').style.display = 'flex';
    });
  }

  function hideQCM() {
    document.getElementById('qcm-zone').style.display = 'none';
    document.getElementById('free-zone').style.display = 'flex';
  }

  /* ══════════════════════════════════════════
     AUTO-CORRECTION — Algorithme de similarité
     ══════════════════════════════════════════ */

  // Normalise une chaîne : minuscules, sans accents, sans articles, sans ponctuation
  function normalize(str) {
    return str
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   // accents → base (é→e)
      .replace(/[''´`]/g, "")                              // apostrophes
      .replace(/\b(le|la|les|l|un|une|des|the|a|an)\b/g, "") // articles
      .replace(/[^a-z0-9 ]/g, "")                          // ponctuation
      .replace(/\s+/g, " ").trim();
  }

  // Distance de Levenshtein (nombre de modifications pour passer de a à b)
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, (_, i) =>
      Array.from({ length: n + 1 }, (_, j) => j === 0 ? i : 0)
    );
    for (let j = 1; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++)
      for (let j = 1; j <= n; j++)
        dp[i][j] = a[i-1] === b[j-1]
          ? dp[i-1][j-1]
          : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    return dp[m][n];
  }

  // Retourne true si la réponse est "assez proche" de la solution
  // Tolérance : jusqu'à 25 % d'erreur sur la longueur max
  function isSimilarEnough(answer, solution) {
    const a = normalize(answer);
    const s = normalize(solution);
    if (!a || !s) return false;
    if (a === s) return true;
    const maxLen = Math.max(a.length, s.length);
    const dist   = levenshtein(a, s);
    return dist / maxLen <= 0.25;
  }

  /* ── ENVOI DE LA RÉPONSE ── */
  function sendAnswer(isQcm, qcmText, qcmBtn, solution) {
    if (hasAnswered) return;

    const text = isQcm ? qcmText : document.getElementById('answer-input').value.trim();
    if (!text) { setFeedback("Tape une réponse !", 'err'); return; }

    db.ref('gameState').once('value', (snap) => {
      const state = snap.val();
      if (!state || state.accepting !== true) {
        setFeedback("⏳ Trop tard ! Temps écoulé.", 'err');
        return;
      }

      hasAnswered = true;
      document.getElementById('send-btn').disabled = true;
      document.getElementById('answer-input').value = '';

      if (isQcm) {
        /* ── QCM : correction exacte ── */
        const isCorrect = text === state.solution;
        if (qcmBtn) qcmBtn.classList.add(isCorrect ? 'correct' : 'wrong');
        document.querySelectorAll('.btn-choice').forEach(b => b.disabled = true);

        db.ref('answers/' + myId).set({
          text: text + " (QCM)",
          name: myName, avatar: myAvatar,
          autoChecked: true
        });

        if (isCorrect) {
          db.ref('players/' + myId + '/score').transaction(s => (s || 0) + 1);
          setFeedback("🎯 Bonne réponse ! +1 pt", 'ok');
        } else {
          setFeedback(`❌ Faux ! C'était : ${state.solution}`, 'err');
        }

      } else {
        /* ── Réponse libre : auto-correction floue ── */
        const correct = isSimilarEnough(text, state.solution);

        if (correct) {
          // Bonne réponse (exacte ou proche) → +3 pts, marqué AUTO
          db.ref('players/' + myId + '/score').transaction(s => (s || 0) + 3);
          db.ref('answers/' + myId).set({
            text: text + " (AUTO ✅)",
            name: myName, avatar: myAvatar,
            autoChecked: true
          });
          setFeedback("🎯 Bonne réponse ! +3 pts", 'ok');
        } else {
          // Trop éloigné → envoyé à l'hôte pour correction manuelle
          db.ref('answers/' + myId).set({
            text: text,
            name: myName, avatar: myAvatar,
            autoChecked: false
          });
          setFeedback("✅ Réponse envoyée !", 'sent');
        }
        hideQCM();
      }
    });
  }

  /* ── ENTRÉE CLAVIER ── */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (currentScreen === 'screen-login') joinGame();
      else if (currentScreen === 'screen-game') sendAnswer(false);
    }
  });
</script>
</body>
</html>
