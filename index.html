<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Salon Blind Test</title>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { background: #0d1117; color: white; font-family: sans-serif; text-align: center; padding: 20px;}
    .container { max-width: 800px; margin: auto; }
    #qrcode { background: white; padding: 15px; display: inline-block; border-radius: 10px; margin: 10px;}
    .hidden { display: none !important; }
    .lobby-list, .leaderboard-box { background: #161b22; border-radius: 10px; padding: 20px; border: 1px solid #30363d; margin-top:20px;}
    li { list-style: none; font-size: 1.3em; color: #58a6ff; margin: 5px; }
    #yt-player-container { height: 1px; width: 1px; overflow: hidden; position: absolute; left: -9999px; }
    #answer-display { font-size: 2em; color: #f2cc60; margin: 20px; font-weight: bold; }
    .num-input { font-size:1.2em; width:60px; border-radius: 5px; background: #0d1117; color: white; border: 1px solid #30363d; padding: 5px;}
    button { background: #1f6feb; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px;}
    .danger-btn { background: #da3633; }
    #reveal-btn { background: #238636; }
    #next-btn { background: #8957e5; }
    .answer-card { background: #21262d; padding: 15px; margin: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #58a6ff;}
    .point-btn { background: #238636; font-size: 0.9em; padding: 8px 15px;}
  </style>
</head>
<body>

<div class="container">
  <h1 id="game-title">🏠 Salon Blind Test PRO</h1>
  
  <div id="setup-area">
    <p>Scanner pour rejoindre :</p>
    <div id="qrcode"></div>
    <div class="lobby-list">
      <h3>Joueurs connectés :</h3>
      <ul id="player-list"></ul>
    </div>
    <div id="game-options" class="hidden">
      <button onclick="resetLobby()" class="danger-btn">Vider le salon 🗑️</button><br><br>
      <label>Nombre de questions :</label>
      <input type="number" id="nb-questions" value="3" min="1" max="10" class="num-input"><br><br>
      <button onclick="startMultiplayerGame()">Lancer la partie ! 🚀</button>
    </div>
  </div>

  <div id="game-area" class="hidden">
    <div id="yt-player-container"><div id="yt-player"></div></div>
    <h2 id="question-num">Question</h2>
    
    <div id="timer-display" style="font-size: 4em; color: #ff7b72; font-weight: bold; margin: 10px;">10</div>
    
    <div id="answers-feed"></div>
    <div id="answer-display" class="hidden"></div>
    
    <div class="controls">
        <button onclick="revealResult()" id="reveal-btn" class="hidden">Révéler la réponse 👁️</button>
        <button onclick="nextRound()" id="next-btn" class="hidden">Suivant ➡️</button>
    </div>
    
    <div class="leaderboard-box">
      <h3>🏆 Classement en direct</h3>
      <ul id="leaderboard-list"></ul>
    </div>
  </div>
</div>

<script>
  // CONFIGURATION FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyC18xshyF3ShbjesR5NsjdmBfAiBaP36BE",
    authDomain: "blindtestfamille.firebaseapp.com",
    databaseURL: "https://blindtestfamille-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "blindtestfamille",
    storageBucket: "blindtestfamille.firebasestorage.app",
    messagingSenderId: "319100843512",
    appId: "1:319100843512:web:5fb89272cd2131f350920d"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // QR CODE
  const manetteUrl = "https://tbamox.github.io/Blindtest/manette.html"; 
  new QRCode(document.getElementById("qrcode"), manetteUrl);

  // PLAYLIST
  let basePlaylist = [
    { titre: "Le Roi Lion", id: "08pZpY_mPto", start: 10, choix: ["Le Roi Lion", "Aladdin", "Mulan", "Tarzan"] },
    { titre: "Pokémon", id: "5y-wGgXMeo0", start: 0, choix: ["Pokémon", "Digimon", "Yu-Gi-Oh", "Beyblade"] },
    { titre: "Star Wars", id: "EjMNNpIksaI", start: 8, choix: ["Star Wars", "Star Trek", "Interstellar", "Dune"] },
    { titre: "Pirates des Caraïbes", id: "K3pOUvO8qTM", start: 0, choix: ["Pirates des Caraïbes", "Vaiana", "Peter Pan", "Sinbad"] },
    { titre: "Harry Potter", id: "Htaj3o3JD8I", start: 0, choix: ["Harry Potter", "Narnia", "Eragon", "Willow"] }
  ];
  let gamePlaylist = [];
  let currentIndex = 0;
  let player;
  let timeLeft = 10;
  let timerInterval;
  let currentAnswers = {};

  // YOUTUBE API
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', { height: '0', width: '0' });
  }

  // GESTION DES JOUEURS
  db.ref('players').on('value', (snap) => {
    const players = snap.val();
    const list = document.getElementById('player-list');
    const leaderboard = document.getElementById('leaderboard-list');
    list.innerHTML = ""; leaderboard.innerHTML = "";
    if(players) {
      document.getElementById('game-options').classList.remove('hidden');
      let arr = Object.keys(players).map(id => ({ id, ...players[id] }));
      arr.sort((a, b) => b.score - a.score);
      arr.forEach(p => {
        const av = p.avatar || "👤";
        list.innerHTML += `<li>${av} ${p.name}</li>`;
        leaderboard.innerHTML += `<li><strong>${av} ${p.name}</strong> : ${p.score} pts</li>`;
      });
    }
  });

  function resetLobby() {
    if(confirm("Tout vider ?")) { 
        db.ref('players').remove(); 
        db.ref('answers').remove(); 
        db.ref('gameState').set({accepting: false}); 
    }
  }

  // GESTION DES RÉPONSES ET DE L'AFFICHAGE (Anti-Triche)
  db.ref('answers').on('value', (snap) => {
    currentAnswers = snap.val() || {};
    renderAnswers();
  });

  function renderAnswers() {
    const feed = document.getElementById('answers-feed');
    const isTimeUp = (timeLeft <= 0);
    
    if(Object.keys(currentAnswers).length > 0) {
      feed.innerHTML = "<h3>Statut des joueurs :</h3>";
      Object.keys(currentAnswers).forEach(id => {
        const ans = currentAnswers[id];
        const av = ans.avatar || "👤";
        
        // Cache le texte tant que le timer tourne
        let displayTexte = isTimeUp ? `"${ans.text}"` : "📩 Réponse envoyée...";
        let actionBtn = "";

        // Si le temps est écoulé, on affiche les boutons de points (sauf si c'est un QCM déjà auto-corrigé)
        if (isTimeUp) {
            if (ans.text.includes("(QCM)")) {
                actionBtn = `<span style="color:#8b949e; font-size:0.9em; font-style:italic;">(QCM Auto-corrigé)</span>`;
            } else {
                actionBtn = `<button class="point-btn" onclick="givePoints('${id}', 3)">+3 Pts ✅</button>`;
            }
        }
        
        feed.innerHTML += `
          <div class="answer-card">
            <div><strong>${av} ${ans.name} :</strong> <span style="margin-left: 10px;">${displayTexte}</span></div>
            ${actionBtn}
          </div>`;
      });
    } else {
      feed.innerHTML = "";
    }
  }

  function givePoints(playerId, points) {
    db.ref('players/' + playerId).once('value', s => {
      if(s.val()) db.ref('players/' + playerId).update({ score: s.val().score + points });
    });
  }

  // LOGIQUE DU JEU
  function startMultiplayerGame() {
    let nb = document.getElementById('nb-questions').value;
    gamePlaylist = basePlaylist.sort(() => 0.5 - Math.random()).slice(0, nb);
    document.getElementById('setup-area').classList.add('hidden');
    document.getElementById('game-area').classList.remove('hidden');
    loadTrack();
  }

  function loadTrack() {
    timeLeft = 10;
    document.getElementById('timer-display').innerText = timeLeft;
    document.getElementById('question-num').innerText = `Question ${currentIndex + 1} / ${gamePlaylist.length}`;
    document.getElementById('answer-display').classList.add('hidden');
    document.getElementById('next-btn').classList.add('hidden');
    document.getElementById('reveal-btn').classList.add('hidden');
    
    db.ref('answers').remove();
    
    // On envoie toutes les infos aux manettes
    db.ref('gameState').set({ 
        accepting: true, 
        choix: gamePlaylist[currentIndex].choix,
        solution: gamePlaylist[currentIndex].titre
    });
    
    player.loadVideoById({ videoId: gamePlaylist[currentIndex].id, startSeconds: gamePlaylist[currentIndex].start });

    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer-display').innerText = timeLeft;
      if(timeLeft <= 0) {
        clearInterval(timerInterval);
        stopAnswering();
      }
    }, 1000);
  }

  function stopAnswering() {
    player.stopVideo();
    db.ref('gameState').update({ accepting: false }); 
    document.getElementById('timer-display').innerText = "TEMPS ÉCOULÉ !";
    document.getElementById('reveal-btn').classList.remove('hidden');
    renderAnswers(); // Force l'affichage des réponses cachées
  }

  function revealResult() {
    document.getElementById('answer-display').innerText = "Réponse : " + gamePlaylist[currentIndex].titre;
    document.getElementById('answer-display').classList.remove('hidden');
    document.getElementById('reveal-btn').classList.add('hidden');
    document.getElementById('next-btn').classList.remove('hidden');
  }

  function nextRound() {
    currentIndex++;
    if(currentIndex < gamePlaylist.length) { loadTrack(); } 
    else { alert("Fin du jeu !"); location.reload(); }
  }
</script>
</body>
</html>
